:root{--onacc:#1B2A41;--bg:#0E1624;--bg2:#131E30;--card:#172438;--card2:#1D2C44;--line:#2A3A55;--text:#EDE6D6;--muted:#98A3B5;--gold:#D6B563;--gold2:#B8913F;--goldbg:rgba(214,181,99,.13);
 --green:#6FBF8E;--greenbg:rgba(111,191,142,.14);--red:#E58A74;--redbg:rgba(229,138,116,.14);--blue:#7FA7D9;--shadow:0 10px 30px rgba(0,0,0,.35);--r:18px}
[data-theme=rose]{--onacc:#fff;--bg:#FBF3F1;--bg2:#F6E7E3;--card:#FFFFFF;--card2:#FDF7F5;--line:#EFD9D3;--text:#4A1F2C;--muted:#8A6F74;--gold:#B86B5A;--gold2:#9C5646;--goldbg:rgba(184,107,90,.12);
 --green:#3F7F5E;--greenbg:#E2F0E7;--red:#B8434A;--redbg:#F8DEDF;--blue:#6A5A9E;--shadow:0 10px 28px rgba(74,31,44,.08)}
[data-theme=sage]{--onacc:#fff;--bg:#F1F4EE;--bg2:#E5EBE1;--card:#FFFFFF;--card2:#F7F9F4;--line:#D9E3D4;--text:#1F3A33;--muted:#687A71;--gold:#4E8B6E;--gold2:#3D7359;--goldbg:rgba(78,139,110,.12);
 --green:#2F7D55;--greenbg:#E1F0E6;--red:#B5523B;--redbg:#F6E0D8;--blue:#3D6E8C;--shadow:0 10px 28px rgba(31,58,51,.08)}
[data-theme=lavender]{--onacc:#fff;--bg:#F5F2FB;--bg2:#ECE6F8;--card:#FFFFFF;--card2:#FAF8FE;--line:#E3DCF2;--text:#2E2750;--muted:#77719A;--gold:#7C63C9;--gold2:#6550AE;--goldbg:rgba(124,99,201,.12);
 --green:#3B8C69;--greenbg:#E1F2EA;--red:#C24E67;--redbg:#F9E0E6;--blue:#4F7CC9;--shadow:0 10px 28px rgba(46,39,80,.09)}
[data-theme=ocean]{--onacc:#07262B;--bg:#08171C;--bg2:#0C2128;--card:#102C35;--card2:#153641;--line:#224A56;--text:#E2F1F1;--muted:#8DB0B4;--gold:#5CC6BE;--gold2:#3FA9A1;--goldbg:rgba(92,198,190,.13);
 --green:#7DD3A1;--greenbg:rgba(125,211,161,.14);--red:#F29078;--redbg:rgba(242,144,120,.14);--blue:#8FB8F0;--shadow:0 10px 30px rgba(0,0,0,.38)}
[data-theme=ivory]{--onacc:#fff;--bg:#F6F1E6;--bg2:#EFE7D6;--card:#FFFFFF;--card2:#FBF7EF;--line:#E6DCC6;--text:#1B2A41;--muted:#6E7482;--gold:#B8913F;--gold2:#9C7A31;--goldbg:rgba(184,145,63,.12);
 --green:#2F7D55;--greenbg:#E3F1E8;--red:#B5523B;--redbg:#F8E2DA;--blue:#2E5E9E;--shadow:0 10px 28px rgba(27,42,65,.10)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
.serif{font-family:'Playfair Display',Georgia,serif}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;flex:0 0 232px;background:var(--bg2);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.brand .lg{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2A3F60,#0E1624);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',Georgia,serif;color:var(--gold);font-weight:700;font-size:20px}
.brand b{display:block;font-size:14px;letter-spacing:.3px}.brand small{color:var(--muted);font-size:11.5px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;border:0;background:none;text-align:left;width:100%}
.nav:hover{background:var(--card)}.nav.on{background:var(--goldbg);color:var(--gold)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.side .grow{flex:1}
.side .log{margin-top:8px;background:var(--gold);color:var(--onacc);border:0;border-radius:12px;padding:11px;font-weight:800;cursor:pointer}
/* main */
.main{flex:1;min-width:0;padding:26px 30px 110px;max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:30px;line-height:1.1}
.top .sub{color:var(--muted);font-size:13px;margin-top:4px}
.chipbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--text)}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--onacc)}
.btn.ghost{background:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.red{color:var(--red)}
.grid{display:grid;gap:18px}.grid>*,.inl>*{min-width:0}html,body{overflow-x:hidden}
.g2{grid-template-columns:1.25fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card h3{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .btn{letter-spacing:0;text-transform:none}
.hero{background:linear-gradient(145deg,var(--card2),var(--card));position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--goldbg),transparent 70%)}
.label{font-size:12px;letter-spacing:1.8px;text-transform:uppercase;font-weight:800;color:var(--gold)}
.big{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:64px;line-height:1.05;margin:6px 0 4px;letter-spacing:-.5px}
.big .cur{font-size:.5em;vertical-align:.65em;margin-right:3px;color:var(--muted)}
.big.neg{color:var(--red)}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.gold-t{color:var(--gold)}.green-t{color:var(--green)}.red-t{color:var(--red)}
.link{color:var(--gold);cursor:pointer;font-weight:700;background:none;border:0;padding:0;font-size:13px}
.bar{height:9px;border-radius:9px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:var(--gold)}
.bar.green i{background:var(--green)}.bar.red i{background:var(--red)}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}.row .nm{font-weight:700;font-size:14px}.row .meta{color:var(--muted);font-size:12px;margin-top:2px}
.amt{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px}
.pill.gold{background:var(--goldbg);color:var(--gold)}.pill.green{background:var(--greenbg);color:var(--green)}.pill.red{background:var(--redbg);color:var(--red)}.pill.grey{background:var(--line);color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;flex:0 0 26px;display:flex;align-items:center;justify-content:center;font-weight:900;color:transparent}
.tick.on{background:var(--green);border-color:var(--green);color:#fff}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.qa{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.qa:hover,.qa.on{border-color:var(--gold);color:var(--gold)}
.inp{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;outline:none}
.inp:focus{border-color:var(--gold)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;display:block}
.inl{display:flex;gap:10px}.inl>*{flex:1}
.envs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.env{border:1px solid var(--line);border-radius:20px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;background:none}
.env.on{background:var(--gold);color:var(--onacc);border-color:var(--gold)}
.next{display:flex;gap:14px;align-items:center;background:var(--goldbg);border:1px solid var(--gold);border-radius:16px;padding:14px 16px}
.next .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--onacc);display:flex;align-items:center;justify-content:center;font-weight:900;flex:0 0 34px}
.kpi .v{font-family:'Playfair Display',Georgia,serif;font-size:28px;font-weight:700;margin-top:4px}
.kpi .k{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;color:var(--muted)}
/* forecast */
.fc{display:flex;gap:6px;align-items:flex-end;height:120px;padding-top:6px}
.fc .d{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;min-width:0;height:100%}
.fc .cw{flex:1;width:100%;display:flex;align-items:flex-end}
.fc .col{width:100%;border-radius:6px 6px 3px 3px;background:var(--goldbg);border:1px solid var(--gold);position:relative}
.fc .col.bill{background:var(--redbg);border-color:var(--red)}
.fc .col.pay{background:var(--greenbg);border-color:var(--green)}
.fc .dl{font-size:10px;color:var(--muted);font-weight:700}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;font-weight:800;color:var(--muted);text-align:center;letter-spacing:1px;padding:4px 0}
.cal .c{min-height:92px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .c.out{opacity:.35}.cal .c.today{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.cal .c .dn{font-weight:800;font-size:13px}
.cal .c.pay{background:linear-gradient(180deg,var(--goldbg),var(--card2))}
.cal .ev{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.p{background:var(--gold);color:var(--onacc)}.ev.b{background:var(--redbg);color:var(--red)}.ev.b.paid{background:var(--greenbg);color:var(--green)}.ev.s{color:var(--muted);background:none;padding:0 5px}
/* ring */
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center;flex:0 0 74px}
.ring span{width:58px;height:58px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
/* modal */
.mask{position:fixed;inset:0;background:rgba(5,10,18,.62);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line);border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.modal h2{font-family:'Playfair Display',Georgia,serif;font-size:24px;margin-bottom:4px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:60;opacity:0;transition:.25s;pointer-events:none;display:flex;gap:12px;align-items:center}
.toast.on{opacity:1;pointer-events:auto}.toast button{background:none;border:0;color:var(--gold2);font-weight:800;cursor:pointer}
/* mobile nav */

/* ---------- dates (local, YYYY-MM-DD) ---------- */
const pad = n => String(n).padStart(2,'0');
const ds = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addD = (s,n) => { const d = pd(s); d.setDate(d.getDate()+n); return ds(d); };
const addM = (s,n) => { const d = pd(s), day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); return ds(d); };
const diff = (a,b) => Math.round((pd(a)-pd(b))/864e5);
const TODAY = () => ds(new Date());
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const longD = s => { const d = pd(s); return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear(); };

/* ---------- lock + encryption (PBKDF2 + AES-GCM) ---------- */
let lockInfo = (() => { try { const o = JSON.parse(localStorage.getItem(LOCK)); if (o && o.locked && o.salt) return o; } catch(e){} return {locked:false}; })();
const saveLock = () => { try { localStorage.setItem(LOCK, JSON.stringify(lockInfo)); } catch(e){} };
let cryptoKey = null;
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const newSalt = () => b64(crypto.getRandomValues(new Uint8Array(16)));
async function deriveKey(pin, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(String(pin)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(salt), iterations:210000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptText(text, key, salt){ const iv = crypto.getRandomValues(new Uint8Array(12)); const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(text)); return JSON.stringify({enc:1, kind:'sig-brain', salt, iv:b64(iv), ct:b64(ct)}); }
async function decryptText(blob, key){ const o = typeof blob === 'string' ? JSON.parse(blob) : blob; const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(o.iv)}, key, unb64(o.ct)); return new TextDecoder().decode(pt); }

function shell(inner){ close(); document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">${inner}</div>`; }

    <div class="chipbar" style="justify-content:center;margin-top:12px"><button class="btn sm ghost" id="forgotB">Forgot PIN?</button></div></div>`);
  document.getElementById('unlockB').onclick = unlock; document.getElementById('pinIn').onkeydown = e => { if (e.key === 'Enter') unlock(); };
  document.getElementById('forgotB').onclick = () => modal(`<h2>Forgot your PIN?</h2><div class="small" style="line-height:1.55">Your numbers are encrypted with your PIN, so nobody (not even us) can open them without it. That is what keeps them private.</div>

  setTimeout(() => { const i = document.getElementById('pinIn'); if (i) i.focus(); }, 50); }
async function unlock(){ const msg = document.getElementById('pinMsg'), pin = (document.getElementById('pinIn')||{}).value || '';
  if (Date.now() < pinWait) { msg.textContent = 'Too many tries. Wait a few seconds.'; return; }
  if (!/^\d{4,8}$/.test(pin)) { msg.textContent = 'Your PIN is 4 to 8 numbers.'; return; }
  msg.textContent = 'Unlocking...';
  try { const key = await deriveKey(pin, lockInfo.salt); const raw = localStorage.getItem(KEY); const d = raw ? JSON.parse(await decryptText(raw, key)) : null; cryptoKey = key; pinTries = 0; S = d ? clean(d) : null; afterOpen(); }
  catch(e){ pinTries++; if (pinTries >= 5) { pinWait = Date.now() + 30000; pinTries = 0; } msg.textContent = 'That PIN did not work.'; const i = document.getElementById('pinIn'); if (i) { i.value = ''; i.focus(); } } }

function leakReport(rows, from){ const L = findLeaks(rows), known = new Set(S.bills.map(b => leakName(b.name))), perT = {w:'a week', m:'a month', y:'a year'};

  modal(`<h2>🕵️ Money leaks</h2><div class="small muted">From ${from}: ${rows.length} rows, about ${Math.max(1,Math.round(L.days/30.44))} month${Math.round(L.days/30.44)>1?'s':''}. Checked on this device only.</div>
    <div class="leak"><div class="label">Found about</div><div class="big2">${money(L.total,0)} <span class="small muted">a year</span></div><div class="tiny muted">in repeat payments and fees. Worth a look, nothing to feel bad about.</div></div>
    <div class="leak"><b>🔁 Repeat payments (${L.subs.length}) · ${money(L.subYear,0)} a year</b>${L.subs.length ? L.subs.slice(0,12).map(x => `<div class="row"><div class="grow"><div class="nm">${esc(x.name)}</div><div class="meta">${money(x.amt,2)} ${perT[x.per]} · seen ${x.n} times</div></div><span class="pill gold">${money(x.year,0)}/yr</span>${known.has(leakName(x.name)) ? '<span class="pill green">In Bills</span>' : `<button class="btn sm" data-act="leakAddBill" data-n="${esc(x.name)}" data-v="${x.per==='w'?r2(x.amt*52/12):x.per==='y'?r2(x.amt/12):x.amt}" data-d="${x.last}">Add to Bills</button>`}</div>`).join('') : '<div class="small muted" style="margin-top:6px">No repeat payments found. A file with 2 or more months finds more.</div>'}</div>
    <div class="leak"><b>🧾 Bank fees (${L.fees.length}) · about ${money(L.feeYear,0)} a year</b>${L.fees.length ? L.fees.slice(0,8).map(r => `<div class="row"><div class="grow"><div class="nm">${esc(r.note)}</div><div class="meta">${nice(r.date)}</div></div><div class="amt red-t">${money(r.amt,2)}</div></div>`).join('') : '<div class="small muted" style="margin-top:6px">No fees found. Nice.</div>'}</div>

  resetDone(){ clearInterval(window.__rt); const wk = weekStart(); if (!S.resets.includes(wk)) S.resets.push(wk); const w = val('rs_win'); if (w) S.dump.push({id:uid(), t:'Win: ' + w, date:TODAY()}); save(); close(); render(); confetti(); toast('🔄 Weekly reset done. Your garden grew.'); },
  saveSettings(){ S.payday = val('s_pay'); S.payEvery = +val('s_every') || 14; S.buffer = Math.max(0, num('s_buf')); S.cur = CURS.includes(val('s_cur')) ? val('s_cur') : '$'; S.name = val('s_name').slice(0,40); save(); render(); toast('Saved.'); },
  pick(el){ const f = el.dataset.f, v = el.dataset.v; S.profile[f] = v === '1' ? true : v === '' ? false : v; save(); render(); },
  privacy(){ S.profile.privacy = !S.profile.privacy; save(); render(); toast(S.profile.privacy ? 'Amounts hidden.' : 'Amounts showing.'); },
  themeModal(){ modal(`<h2>Colours</h2><div class="swatches">${THEMES.map(t => `<button class="sw ${S.theme===t[0]?'on':''}" data-act="setTheme" data-v="${t[0]}"><div class="pv" style="background:${t[3][0]}"><i style="height:26px;background:${t[3][1]}"></i><i style="height:38px;background:${t[3][2]}"></i><i style="height:18px;background:${t[3][1]}"></i></div><b>${t[1]}</b><small>${t[2]}</small></button>`).join('')}</div><div class="acts"><button class="btn gold" data-act="close">Done</button></div>`); },
  setTheme(el){ S.theme = el.dataset.v; save(); render(); A.themeModal(); },
  pinModal(){ modal(`<h2>${lockInfo.locked ? 'Change your PIN' : 'Lock with a PIN'}</h2><div class="small muted" style="line-height:1.5">Your data is encrypted on this device with your PIN (AES-256). <b>If you forget it, the data cannot be recovered</b>, so keep a backup.</div>
    <div class="inl"><div><label class="lbl">New PIN (4 to 8 numbers)</label><input class="inp" id="pin1" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div><div><label class="lbl">Type it again</label><input class="inp" id="pin2" type="password" inputmode="numeric" maxlength="8" autocomplete="new-password"></div></div>
    <div class="acts">${lockInfo.locked ? '<button class="btn red" data-act="pinRemove">Remove PIN</button>' : ''}<button class="btn ghost" data-act="close">Cancel</button><button class="btn gold" data-act="pinSave">Save PIN</button></div>`); },
  async pinSave(){ const a = val('pin1'), b = val('pin2'); if (!/^\d{4,8}$/.test(a)) return toast('Use 4 to 8 numbers.'); if (a !== b) return toast('The two PINs do not match.'); const salt = newSalt(); cryptoKey = await deriveKey(a, salt); lockInfo = {locked:true, salt}; saveLock(); save(); close(); render(); toast('🔒 PIN saved. Your data is encrypted.'); },
  pinRemove(){ if (!confirm('Remove the PIN?')) return; lockInfo = {locked:false}; saveLock(); cryptoKey = null; save(); close(); render(); toast('PIN removed.'); },
  lockNow(){ lockNow(); },
  async backup(){ dl(new Blob([await backupText()], {type:'application/json'}), `money-brain-backup-${TODAY()}.json`); markBackedUp(); render(); toast('💾 Backup saved. Keep it somewhere safe.'); },
  async shareBackup(){ const f = new File([await backupText()], `money-brain-backup-${TODAY()}.json`, {type:'application/json'}); markBackedUp(); try { if (navigator.canShare && navigator.canShare({files:[f]})) { await navigator.share({files:[f], title:'Money Brain backup'}); return; } } catch(e){ if (e && e.name === 'AbortError') return; } A.backup(); },
  restore(){ let f = document.getElementById('restoreFile'); if (!f) { f = document.createElement('input'); f.type = 'file'; f.accept = '.json,application/json'; }
    f.onchange = () => { const file = f.files[0]; if (!file) return; if (file.size > 8e6) return toast('That file is too big to be a backup.'); const r = new FileReader();
      r.onload = () => { try { const d = JSON.parse(r.result); if (d && d.enc === 1 && d.ct && d.salt) return restoreEncrypted(d); if (!d || typeof d !== 'object' || !d.v || (d.kind && d.kind !== 'sig-brain')) throw 0;
        S = clean(d); S.setupDone = true; S.appWelcomed = true; S.quietWins = true; save(); view = 'today'; render(); toast('✅ Backup brought back. Welcome back!'); } catch(e){ toast('That file is not a Money Brain backup.'); } }; r.readAsText(file); }; f.click(); },
  csv(){ const rows = [['Date','Amount','Type','Note']].concat(S.spends.slice().sort((a,b) => a.date < b.date ? -1 : 1).map(s => [s.date, s.amount, catOf(s.cat)[2], s.note])); dl(new Blob([rows.map(r => r.map(x => '"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n')], {type:'text/csv'}), `spending-${TODAY()}.csv`); },
  abOn(){ abOn(); }, abResume(){ abResume(); }, abOff(){ abOff(); }, backupLater(){ S.backupSnooze = TODAY(); save(true); render(); },
  async install(){ if (deferredPrompt) { deferredPrompt.prompt(); const r = await deferredPrompt.userChoice.catch(() => null); deferredPrompt = null; if (r && r.outcome === 'accepted') { S.installed = true; save(); } render(); return; } A.installHelp(); },
  installLater(){ S.installHide = TODAY(); save(); render(); },
  installHelp(){ modal(`<div style="display:flex;gap:14px;align-items:center"><img src="icon-192.png" alt="" style="width:60px;height:60px;border-radius:15px"><div><h2 style="margin:0">Install ${APPNAME}</h2><div class="tiny muted">Your own app icon, works offline</div></div></div>
    <div class="ios-steps">${isIOS() ? `<div>Open this page in <b>Safari</b></div><div>Tap <b>Share</b> ${SHARE_ICON}</div><div>Tap <b>Add to Home Screen</b> ${ADD_ICON}</div>` : /android/i.test(navigator.userAgent) ? '<div>Open in <b>Chrome</b></div><div>Tap the <b>⋮</b> menu</div><div>Tap <b>Install app</b></div>' : `<div>Click the install icon ${ADD_ICON} in the address bar (Chrome or Edge)</div><div>Click <b>Install</b></div>`}</div><div class="acts"><button class="btn gold" data-act="close">Got it</button></div>`); },
  exampleAgain(){ if (!confirm('Replace your numbers with the example? Save a backup first if you want to keep them.')) return; S = example(); save(); view = 'today'; render(); },
  startFresh(){ const keep = {theme:S.theme, cur:S.cur}; S = blank(); Object.assign(S, keep); save(true); onboard(); },
  erase(){ if (!confirm('Delete everything on this device? This cannot be undone.')) return; localStorage.removeItem(KEY); lockInfo = {locked:false}; saveLock(); cryptoKey = null; S = null; onboard(); },
  waSave(){ const nm = val('wa_name'); if (nm) S.name = nm.slice(0,40); S.appWelcomed = true; save(); close(); render(); },
  obGo(){ S.name = val('ob_name').slice(0,40); S.cur = CURS.includes(val('ob_cur')) ? val('ob_cur') : '$'; const b = val('ob_bal'); S.balance = num('ob_bal'); S.balanceDate = TODAY(); S.balanceTs = Date.now(); S.payday = val('ob_pay'); S.payEvery = +val('ob_every') || 14;
    if (b === '' || !S.payday) return toast('Type your balance and your next payday.'); S.setupDone = true; S.start = TODAY(); save(); afterOpen(); },
  obExample(){ S = example(); S.appWelcomed = true; save(); afterOpen(); }, obRestore(){ A.restore(); }
};
window.startTimer = () => { let s = 300; clearInterval(window.__rt); window.__rt = setInterval(() => { const e = document.getElementById('rtimer'); if (!e) return clearInterval(window.__rt); s--; e.textContent = Math.floor(s/60) + ':' + pad(s%60); if (s <= 0) { clearInterval(window.__rt); e.textContent = 'Time!'; try { navigator.vibrate && navigator.vibrate([100,80,100]); } catch(err){} } }, 1000); };
function backupCard(){ if (!S || S.example || abState === 'on') return ''; const has = S.spends.length > 5, age = S.lastBackup ? diff(TODAY(), S.lastBackup) : 999;
  if (!has || age < 7 || (S.backupSnooze && diff(TODAY(), S.backupSnooze) < 3)) return '';
  return `<div class="install">${ico('shield')}<div class="grow"><b>Keep everything safe</b><div class="tiny muted">${S.lastBackup ? 'Last backup '+age+' days ago.' : 'No backup yet.'} A backup brings it all back on a new phone.</div></div><button class="btn gold" data-act="${FSA?'abOn':'shareBackup'}">${FSA?'Back up automatically':'Save a backup'}</button><button class="btn sm ghost" data-act="backupLater">Not now</button></div>`; }
function floatUp(el, text){ if (!el) return; const r = el.getBoundingClientRect(), d = document.createElement('div'); d.className = 'floatup'; d.textContent = text; d.style.left = (r.left + r.width/2) + 'px'; d.style.top = r.top + 'px'; document.body.appendChild(d); setTimeout(() => d.remove(), 1100); }
function weekStart(t = TODAY()){ const d = pd(t), wd = (d.getDay() + 6) % 7; return addD(t, -wd); }

/* ---------- events ---------- */
document.addEventListener('click', e => { const g = e.target.closest('[data-go]'), a = e.target.closest('[data-act]');
  if (a && A[a.dataset.act] && (!g || g.contains(a))) { e.preventDefault(); A[a.dataset.act](a); return; }
  if (g && S) { const v = g.dataset.go; if (v === 'more') return modal(`<h2>More</h2>${[['bills','Bills','calendar'],['garden','Garden & badges','trophy'],['settings','Settings','settings'],['help','Help','help']].map(n => `<button class="nav" data-go="${n[0]}" style="margin-top:4px"><span class="ic">${ico(n[2])}</span>${n[1]}</button>`).join('')}`); view = v; close(); render(); scrollTo(0,0); } });
document.getElementById('mask').addEventListener('click', e => { if (e.target.id === 'mask') close(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') close();
  if (e.key === 'Enter' && e.target.id === 'taskIn' && e.target.value.trim()) { todayPlan().tasks.push({id:uid(), t:e.target.value.trim().slice(0,80), done:false}); save(); render(); setTimeout(() => document.getElementById('taskIn').focus(), 0); }
  if (e.key === 'Enter' && e.target.id === 'dumpIn' && e.target.value.trim()) { S.dump.push({id:uid(), t:e.target.value.trim().slice(0,160), date:TODAY()}); save(); render(); setTimeout(() => document.getElementById('dumpIn').focus(), 0); }
  if (e.key === 'Enter' && e.target.id === 'sp_amt') { const b = document.querySelector('[data-act=saveSpend]'); if (b) A.saveSpend(b); } });

/* ---------- example ---------- */
function example(){ const t = TODAY(), s = blank();
  Object.assign(s, {name:'Sam', example:true, setupDone:true, appWelcomed:true, quietWins:true, balance:1284.6, balanceDate:addD(t,-2), balanceTs:0, payEvery:14, buffer:50, start:addD(t,-60), letGo:212, leakRun:true, leakLast:1103});
  let pday = t; while (pd(pday).getDay() !== 5) pday = addD(pday, 1); if (diff(pday, t) < 3) pday = addD(pday, 7); s.payday = pday;
  const bills = [['Rent',950,1,false],['Phone',35,12,false],['Internet',45,18,false],['Streaming',15.99,9,true],['Music',10.99,14,true],['Gym',29.99,22,true],['Electric',80,26,false]];
  s.bills = bills.map((b,i) => ({id:'b'+i, name:b[0], amount:b[1], day:b[2], sub:b[3], paid:{}}));
  s.bills.forEach(b => { for (let k = 1; k <= 2; k++) b.paid[ym(addM(t, -k))] = true; if (billDue(b, ym(t)) < addD(t,-2)) b.paid[ym(t)] = true; });
  const notes = [['Coffee',3.8,'eat'],['Groceries',42.3,'food'],['Bus',2.9,'move'],['Lunch out',11.5,'eat'],['Pharmacy',8.2,'health'],['Cinema',12,'fun'],['Groceries',28.7,'food'],['Fuel',35,'move']];
  for (let i = 40; i >= 0; i--) { if (i % 5 === 2) continue; const d = addD(t, -i), n = i === 0 ? 1 : 1 + (i % 2); for (let k = 0; k < n; k++) { const x = notes[(i*3+k) % notes.length]; s.spends.push({id:'s'+i+'_'+k, date:d, amount:x[1], note:x[0], cat:x[2], ts:i === 0 ? Date.now() : 0}); } }
  s.plan = {date:t, energy:'low', tasks:[{id:'t1', t:'Tick the phone bill', done:true}, {id:'t2', t:'Reply to the landlord email', done:false}, {id:'t3', t:'Cancel the unused app trial', done:false}, {id:'t4', t:'Buy a birthday card', done:false}], note:''};
  s.dump = [{id:'d1', t:'Ask about the gym contract end date', date:t}, {id:'d2', t:'Idea: cook double on Sunday', date:addD(t,-1)}];
  s.pause = [{id:'pz1', name:'Wireless headphones', price:129, why:'Saw an advert', date:addD(t,-3)}, {id:'pz2', name:'New trainers', price:85, why:'', date:t}];
  s.checks = [addD(t,-16), addD(t,-9), addD(t,-2)]; s.resets = [addD(weekStart(t),-14), addD(weekStart(t),-7)];
  return clean(s); }

/* ---------- onboarding ---------- */
function shellCard(inner){ document.getElementById('app').innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">${inner}</div>`; }
function onboard(){ if (!S) S = blank(); document.documentElement.dataset.theme = themeNow(); close();
  let np = TODAY(); while (pd(np).getDay() !== 5) np = addD(np, 1);
  shellCard(`<div class="card ob"><img src="icon-192.png" alt="" style="width:72px;height:72px;border-radius:18px"><h2 class="serif">Welcome to ${APPNAME} 👋</h2>
    <div class="small muted" style="line-height:1.55">A calm money app for busy brains. Two numbers and you are ready: what is in your account, and when you get paid.</div>
    <div class="obicons"><span>💸<small>Safe to spend</small></span><span>🌤️<small>My day</small></span><span>🕵️<small>Money leaks</small></span><span>⏸️<small>Pause</small></span><span>🌱<small>Garden</small></span></div>
    <div class="inl"><div><label class="lbl">Your first name</label><input class="inp" id="ob_name" maxlength="40" value="${esc(S.name||'')}"></div><div><label class="lbl">Money sign</label><select class="inp" id="ob_cur">${CURS.map(c => `<option ${c===S.cur?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <label class="lbl">What is in your spending account right now?</label><input class="inp" id="ob_bal" inputmode="decimal" placeholder="Look in your banking app">
    <div class="inl"><div><label class="lbl">Your next payday</label><input class="inp" id="ob_pay" type="date" value="${np}"></div><div><label class="lbl">You get paid</label><select class="inp" id="ob_every"><option value="7">Every week</option><option value="14" selected>Every 2 weeks</option><option value="15">Twice a month</option><option value="30">Every month</option></select></div></div>
    <div class="acts" style="justify-content:space-between"><button class="btn ghost" data-act="obExample">👀 Look around with example numbers</button><button class="btn gold" data-act="obGo">Start</button></div>
    <div class="tiny muted" style="margin-top:12px">New phone? <button class="link" data-act="obRestore">Bring back my backup</button></div><input type="file" id="restoreFile" accept=".json,application/json" hidden></div>`); }
function afterOpen(){ if (!S || !S.setupDone) return onboard(); view = bootView || 'today'; bootView = null; S.lastOpen = TODAY(); save(true); render(); abInit(); welcomeApp(); }

/* ---------- boot ---------- */
setInterval(() => { if (!S || !S.setupDone || document.getElementById('mask').classList.contains('on')) return; const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; render(); }, 30 * 60000);
(async () => { try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); } catch(e){} })();
const QS = new URLSearchParams(location.search); let bootView = null;
if (QS.get('view') && NAV.some(n => n[0] === QS.get('view'))) bootView = QS.get('view');
if (QS.has('example') && !localStorage.getItem(KEY) && !lockInfo.locked) { S = example(); if (QS.get('theme')) S.theme = QS.get('theme'); save(true); }
if (lockInfo.locked && isEncrypted(localStorage.getItem(KEY) || '')) lockScreen();
else { if (lockInfo.locked) { lockInfo = {locked:false}; saveLock(); } if (!S) S = load(); if (!S || !S.setupDone) onboard(); else { afterOpen(); if (QS.get('go') === 'log') A.spendModal(); } }
if (S && S.example && QS.get('show')) setTimeout(() => { const w = QS.get('show');
  if (w === 'explain') A.explain();
  if (w === 'log') { A.spendModal(); document.getElementById('sp_amt').value = '12.40'; document.getElementById('sp_note').value = 'Lunch with Mia'; }
  if (w === 'fit') { A.fit(); document.getElementById('ft_amt').value = QS.get('amt') || '60'; document.getElementById('ft_name').value = 'Concert ticket'; A.fitCheck(); }
  if (w === 'check') A.checkMoney();
  if (w === 'reset') A.resetModal();
  if (w === 'pause') A.pauseModal(null, {name:'New trainers', price:85});
  if (w === 'pin') A.pinModal();
  if (w === 'leak') { const r = [], t0 = TODAY(); for (let k = 0; k < 4; k++) { const d = addD(t0, -30*k - 3); r.push({date:d, amount:-15.99, note:'NETFLIX.COM'}, {date:addD(d,2), amount:-10.99, note:'SPOTIFY P1234'}, {date:addD(d,5), amount:-39.99, note:'PURE GYM LTD'}, {date:addD(d,8), amount:-4.99, note:'APPLE.COM/BILL'}, {date:addD(d,11), amount:-7.99, note:'AUDIBLE UK'}); }
    r.push({date:addD(t0,-20), amount:-25, note:'OVERDRAFT FEE'}, {date:addD(t0,-51), amount:-12, note:'LATE PAYMENT FEE'}, {date:addD(t0,-9), amount:-2.99, note:'NON-STERLING TRANSACTION FEE'}, {date:addD(t0,-14), amount:-23.40, note:'DELIVEROO'}, {date:addD(t0,-13), amount:-23.40, note:'DELIVEROO'}); leakReport(r, 'your bank file'); }
}, 400);
if ('serviceWorker' in navigator && location.protocol.startsWith('http') && !QS.has('show')) navigator.serviceWorker.register('sw.js').catch(() => {});
